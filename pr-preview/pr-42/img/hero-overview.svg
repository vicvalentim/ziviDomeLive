  <text x="92" y="854" fill="#d9e6ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="1">ziviDomeLive 2.0</text>
  <text x="1450" y="854" fill="#7392c9" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18">EDITORIAL ILLUSTRATION</text>
</svg>
