# ziviDomeLive Processing contribution metadata source.
# build.gradle.kts generates library.properties from this file.
# Keep claims conservative: supported capabilities are not equivalent to tested platforms.

name=ziviDomeLive
version=11
authors=[Victor Valentim](https://victorvalentim.com/)
url=https://vicvalentim.github.io/ziviDomeLive/
categories=3D, Video & Vision
sentence=Renders Standard, domemaster, equirectangular, and skybox views from Processing sketches.
paragraph=Provides scene management, Standard and spherical rendering, domemaster calibration, equirectangular and skybox representations, and optional NDI, Syphon, or Spout output routing. External-output backends require their platform/runtime dependencies and separate qualification.

# Processing revision compatibility. Revision 1285 is Processing 4.0; the
# source-level baseline can be audited with compileProcessing4Baseline.
minRevision=1285
maxRevision=0

# Qualification claims are intentionally blank until the release evidence records
# the corresponding platform and Processing version. The current Gradle generator
# emits these keys, so blank values prevent unsupported claims without changing
# build/release behavior during the documentation freeze.
tested.platform=
tested.processingVersion=

library.copyright=(c) 2024 Victor Valentim
library.keywords=fulldome, projection, immersive, spherical, 360, visual, real-time, NDI, Syphon, Spout
