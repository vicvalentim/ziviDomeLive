site_name: ziviDomeLive - Processing Library Documentation
site_url: https://vicvalentim.github.io/ziviDomeLive/
repo_url: https://github.com/vicvalentim/ziviDomeLive
repo_name: GitHub
edit_uri: edit/main/docs/
site_description: Real-time immersive visuals and 3D rendering framework for fulldome and VR in Processing
site_author: Victor Valentim
copyright: Copyright &copy; 2024 <a href="https://vicvalentim.com/" target="_blank">Victor Valentim</a> - GPL-2.0-only
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/png/logo.png
  favicon: assets/png/favicon.ico
  font:
    text: Noto Sans
    code: Noto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.prune
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    search: material/magnify
    close: material/close-circle

plugins:
  - search
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: ziviDomeLive - Processing Library Documentation
          site_description: Real-time immersive visuals and 3D rendering framework for fulldome and VR in Processing
        - locale: pt
          name: Português (Brasil)
          build: true
          site_name: ziviDomeLive - Documentação da Biblioteca Processing
          site_description: Framework de visualização imersiva em tempo real e renderização 3D para fulldome e VR em Processing
          nav_translations:
            Home: Início
            Installation: Instalação
            Requirements: Requisitos
            Installation Steps: Passos de Instalação
            Dependencies: Dependências
            NDI Runtime: Runtime NDI
            Getting Started: Introdução
            Quickstart Guide: Guia Rápido
            Key Features: Funcionalidades Principais
            Usage: Uso
            Render Modes: Modos de Renderização
            Visual Capture Guide: Guia de Capturas Visuais
            Control Panel: Painel de Controle
            Spherical Calibration: Calibração Esférica
            Scene Management: Gerenciamento de Cenas
            Event Handling: Manipulação de Eventos
            External Integration: Integração Externa
            Architecture: Arquitetura
            Rendering Pipeline: Pipeline de Renderização
            Runtime Lifecycle: Lifecycle de Runtime
            API Reference: Referência da API
            Overview: Visão Geral
            Core Classes: Classes Principais
            Scene Interface: Interface de Cena
            Scene Services: Serviços de Cena
            Helper Functions: Funções Auxiliares
            Generated Javadocs: Javadocs Gerados
            Examples: Exemplos
            Basic Examples: Exemplos Básicos
            Advanced Examples: Exemplos Avançados
            Qualification: Qualificação
            Processing Publication: Publicação Processing
            Calibration Tool Protocol: Protocolo da Ferramenta de Calibração
            Release Readiness: Prontidão da Release
            Release Readiness 2.0: Prontidão da Release 2.0
            Release Notes: Notas de Versão
            Version 2.0.0: Versão 2.0.0
            Version 1.5.0: Versão 1.5.0
            Project: Projeto
            Contributing: Contribuindo
            Known Issues: Problemas Conhecidos
            Author: Autor
            License: Licença

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - ./examples/
        - ./examples/advanced_usage
        - ./examples/getting_started
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicvalentim/ziviDomeLive
      name: ziviDomeLive on GitHub
    - icon: fontawesome/solid/globe
      link: https://vicvalentim.com/
      name: Victor Valentim

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/extra.js

nav:
  - Home: index.md
  - Installation:
      - Requirements: installation/requirements.md
      - Installation Steps: installation/installation-steps.md
      - Dependencies: installation/dependencies.md
      - NDI Runtime: installation/ndi.md
  - Getting Started:
      - Quickstart Guide: getting-started/quickstart.md
      - Key Features: getting-started/features.md
  - Usage:
      - Render Modes: usage/basic-usage.md
      - Visual Capture Guide: usage/visual-capture-guide.md
      - Control Panel: usage/control-panel.md
      - Spherical Calibration: usage/spherical-calibration.md
      - Scene Management: usage/scene-management.md
      - Event Handling: usage/event-handling.md
      - External Integration: usage/external-integration.md
  - Architecture:
      - Rendering Pipeline: architecture/rendering-pipeline.md
      - Runtime Lifecycle: architecture/runtime-lifecycle.md
  - API Reference:
      - Overview: api/overview.md
      - Core Classes: api/core-classes.md
      - Scene Interface: api/scene-interface.md
      - Scene Services: api/scene-services.md
      - Helper Functions: api/helper-functions.md
      - Generated Javadocs: api/javadocs.md
  - Examples:
      - Basic Examples: examples/basic.md
      - Advanced Examples: examples/advanced.md
  - Qualification:
      - Processing Publication: qualification/processing-publication.md
      - Calibration Tool Protocol: qualification/1.5-calibration-tool.md
      - Release Readiness 2.0: qualification/2.0-release-readiness.md
      - Release Readiness 1.5: qualification/1.5-release-readiness.md
  - Release Notes:
      - Version 2.0.0: release-notes/2.0.0.md
      - Version 1.5.0: release-notes/1.5.0.md
  - Project:
      - Contributing: contributing.md
      - Roadmap: roadmap.md
      - Known Issues: known-issues.md
      - Author: author.md
      - License: license.md
