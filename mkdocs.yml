site_name: ziviDomeLive - Processing Library Documentation
site_url: https://vicvalentim.github.io/ziviDomeLive/
repo_url: https://github.com/vicvalentim/ziviDomeLive
repo_name: GitHub
edit_uri: edit/main/docs/
site_description: Technical documentation for ziviDomeLive real-time fulldome, spherical and immersive rendering workflows in Processing
site_author: Victor Valentim
copyright: Copyright &copy; 2024-2026 Victor Valentim - Apache-2.0
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/png/logo.png
  favicon: assets/png/favicon.ico
  font:
    text: Noto Sans
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle-outline
    previous: material/arrow-left
    next: material/arrow-right

plugins:
  - search
  - tags:
      listings_toc: true
  - social:
      enabled: !ENV [CI, false]
      concurrency: 1
      cards_layout: default/variant
      cards_layout_options:
        background_color: "#032e14"
        color: "#ffffff"
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: ziviDomeLive - Processing Library Documentation
          site_description: Technical documentation for real-time fulldome, spherical and immersive rendering workflows in Processing
        - locale: pt
          name: Português (Brasil)
          build: true
          site_name: ziviDomeLive - Documentação da Biblioteca Processing
          site_description: Documentação técnica para fluxos de renderização fulldome, esférica e imersiva em tempo real no Processing
          nav_translations:
            Home: Início
            Start Creating: Comece a Criar
            Installation: Instalação
            Requirements: Requisitos
            Dependencies: Dependências
            NDI Runtime: Runtime NDI
            Quickstart: Guia Rápido
            Key Concepts: Conceitos Principais
            Creative Guide: Guia Criativo
            Render Modes: Modos de Renderização
            Preview and Output: Preview e Output
            Control Panel: Painel de Controle
            Spherical Calibration: Calibração Esférica
            Camera and Navigation: Câmera e Navegação
            Environment: Environment
            Scene Management: Gerenciamento de Cenas
            Interaction and Events: Interação e Eventos
            External Outputs: Outputs Externos
            Architecture: Arquitetura
            Rendering Pipeline: Pipeline de Renderização
            Runtime Lifecycle: Lifecycle de Runtime
            API Reference: Referência da API
            Overview: Visão Geral
            Core Classes: Classes Principais
            Scene Interface: Interface Scene
            Scene Services: Scene Services
            Helper Functions: Funções Auxiliares
            Performance Profiling: Profiling de Performance
            Generated Javadocs: Javadocs Gerados
            Examples: Exemplos
            Learning Examples: Exemplos de Aprendizagem
            Advanced Examples: Exemplos Avançados
            Qualification: Qualificação
            Benchmark Guide: Guia do Benchmark
            Processing Publication: Publicação Processing
            Calibration Tool Protocol: Protocolo da Ferramenta de Calibração
            Release Readiness 2.0: Prontidão da Release 2.0
            Release Notes: Notas de Versão
            Version 2.0.0: Versão 2.0.0
            Version 1.5.0: Versão 1.5.0
            Project: Projeto
            Contributing: Contribuindo
            Roadmap: Roadmap
            Known Issues: Problemas Conhecidos
            Author: Autor
            License: Licença
            Artist API Map: Mapa da API para Artistas
            Rendering: Renderização
            Outputs: Outputs
            Advanced Stable API: API Advanced Stable
            Experimental API: API Experimental
            Removed 1.x API: API 1.x Removida
            Internal Boundary: Fronteira Internal
            Advanced Projects: Projetos Avançados
            Time and Simulation: Tempo e Simulação
            Assets: Assets
            Background Tasks: Tasks em Background
            Developer Guide: Guia de Desenvolvimento
            Architecture Overview: Visão Geral da Arquitetura
            Standard Domain: Standard Domain
            Spherical Domain: Spherical Domain
            OpenGL Backend: Backend OpenGL
            Lifecycle and Resource Ownership: Lifecycle e Ownership de Recursos
            Threading: Threading
            Output Backends: Backends de Output
            Performance Internals: Internals de Performance
            Testing: Testes
            Qualification Tools: Ferramentas de Qualificação
            Maintainer: Manutenção
            Citation: Citação
            Research Software and JOSS Readiness: Software de Pesquisa e Prontidão JOSS
            Research Integrity, Human Review and Conduct: Integridade Científica, Revisão Humana e Conduta
            Topics: Tópicos
            About: Sobre
            About ziviDomeLive: Sobre o ziviDomeLive

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

extra:
  generator: false
  consent:
    title: Cookie preferences
    description: >-
      This documentation stores essential interface and consent preferences in
      your browser. Optional GitHub repository data is loaded only if you enable
      it. You can change this choice at any time from the Cookies tab.
    cookies:
      github:
        name: GitHub repository data
        checked: false
    actions:
      - accept
      - reject
      - manage
  status:
    stable: Stable API
    advanced: Advanced Stable API
    experimental: Experimental public API
    callback: Processing callback surface
    internal: Internal implementation or migration boundary
    qualification: Qualification or release evidence
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicvalentim/ziviDomeLive
      name: ziviDomeLive on GitHub

extra_css:
  - assets/css/extra.css
  - assets/css/material-editorial.css
extra_javascript:
  - assets/js/extra.js
  - assets/js/splash-sphere.js

