site_name: ziviDomeLive - Processing Library Documentation
site_url: https://vicvalentim.github.io/ziviDomeLive/
repo_url: https://github.com/vicvalentim/ziviDomeLive
repo_name: GitHub
edit_uri: edit/release/2.0.0/docs/
site_description: Technical documentation for ziviDomeLive real-time fulldome, spherical and immersive rendering workflows in Processing
site_author: Victor Valentim
copyright: Copyright &copy; 2024 Victor Valentim - GPL-2.0-only
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/png/logo.png
  favicon: assets/png/favicon.ico
  font:
    text: Noto Sans
    code: Noto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: ziviDomeLive - Processing Library Documentation
          site_description: Technical documentation for real-time fulldome, spherical and immersive rendering workflows in Processing
        - locale: pt
          name: Português (Brasil)
          build: true
          site_name: ziviDomeLive - Documentação da Biblioteca Processing
          site_description: Documentação técnica para fluxos de renderização fulldome, esférica e imersiva em tempo real no Processing
          nav_translations:
            Home: Início
            Start Creating: Comece a Criar
            Installation: Instalação
            Requirements: Requisitos
            Dependencies: Dependências
            NDI Runtime: Runtime NDI
            Quickstart: Guia Rápido
            Key Concepts: Conceitos Principais
            Creative Guide: Guia Criativo
            Render Modes: Modos de Renderização
            Preview and Output: Preview e Output
            Control Panel: Painel de Controle
            Spherical Calibration: Calibração Esférica
            Camera and Navigation: Câmera e Navegação
            Environment: Environment
            Scene Management: Gerenciamento de Cenas
            Interaction and Events: Interação e Eventos
            External Outputs: Outputs Externos
            Architecture: Arquitetura
            Rendering Pipeline: Pipeline de Renderização
            Runtime Lifecycle: Lifecycle de Runtime
            API Reference: Referência da API
            Overview: Visão Geral
            Core Classes: Classes Principais
            Scene Interface: Interface Scene
            Scene Services: Scene Services
            Helper Functions: Funções Auxiliares
            Performance Profiling: Profiling de Performance
            Generated Javadocs: Javadocs Gerados
            Examples: Exemplos
            Learning Examples: Exemplos de Aprendizagem
            Advanced Examples: Exemplos Avançados
            Qualification: Qualificação
            Benchmark Guide: Guia do Benchmark
            Processing Publication: Publicação Processing
            Calibration Tool Protocol: Protocolo da Ferramenta de Calibração
            Release Readiness 2.0: Prontidão da Release 2.0
            Release Notes: Notas de Versão
            Version 2.0.0: Versão 2.0.0
            Version 1.5.0: Versão 1.5.0
            Project: Projeto
            Contributing: Contribuindo
            Roadmap: Roadmap
            Known Issues: Problemas Conhecidos
            Author: Autor
            License: Licença

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicvalentim/ziviDomeLive
      name: ziviDomeLive on GitHub

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/extra.js

nav:
  - Home: index.md
  - Start Creating:
      - Installation: installation/installation-steps.md
      - Requirements: installation/requirements.md
      - Dependencies: installation/dependencies.md
      - NDI Runtime: installation/ndi.md
      - Quickstart: getting-started/quickstart.md
      - Key Concepts: getting-started/features.md
  - Creative Guide:
      - Render Modes: usage/basic-usage.md
      - Preview and Output: usage/visual-capture-guide.md
      - Control Panel: usage/control-panel.md
      - Spherical Calibration: usage/spherical-calibration.md
      - Camera and Navigation: usage/camera-navigation.md
      - Environment: usage/environment.md
      - Scene Management: usage/scene-management.md
      - Interaction and Events: usage/event-handling.md
      - External Outputs: usage/external-integration.md
  - Architecture:
      - Rendering Pipeline: architecture/rendering-pipeline.md
      - Runtime Lifecycle: architecture/runtime-lifecycle.md
  - API Reference:
      - Overview: api/overview.md
      - Core Classes: api/core-classes.md
      - Scene Interface: api/scene-interface.md
      - Scene Services: api/scene-services.md
      - Helper Functions: api/helper-functions.md
      - Performance Profiling: api/performance-profiling.md
      - Generated Javadocs: api/javadocs.md
  - Examples:
      - Learning Examples: examples/basic.md
      - Advanced Examples: examples/advanced.md
  - Qualification:
      - Benchmark Guide: qualification/benchmark-guide.md
      - Processing Publication: qualification/processing-publication.md
      - Benchmark Reporting: qualification/benchmark-reporting.md
      - Automated Benchmarks: qualification/automated-benchmarks.md
      - Calibration Tool Protocol: qualification/1.5-calibration-tool.md
      - Release Readiness 2.0: qualification/2.0-release-readiness.md
      - Release Readiness 1.5: qualification/1.5-release-readiness.md
  - Release Notes:
      - Version 2.0.0: release-notes/2.0.0.md
      - Version 1.5.0: release-notes/1.5.0.md
  - Project:
      - Contributing: contributing.md
      - Roadmap: roadmap.md
      - Known Issues: known-issues.md
      - Author: author.md
      - License: license.md
