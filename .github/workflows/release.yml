name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Run automated qualification
        run: ./gradlew qualificationTests

      - name: Upload automated qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-qualification-${{ github.ref_name }}
          path: |
            build/reports/qualification/
            build/test-results/qualification/
          if-no-files-found: warn
          retention-days: 90

      - name: Build with Gradle
        id: build
        run: ./gradlew buildReleaseArtifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.txt
            release/*.zip
            release/*.pdex
