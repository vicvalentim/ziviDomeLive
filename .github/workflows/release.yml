name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew verifyReleaseTag -PreleaseTag="$RELEASE_TAG"

      - name: Run automated qualification
        run: ./gradlew qualificationTests

      - name: Upload automated qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-qualification-${{ github.ref_name }}
          path: |
            build/reports/qualification/
            build/test-results/qualification/
          if-no-files-found: warn
          retention-days: 90

      - name: Build with Gradle
        id: build
        run: ./gradlew buildReleaseArtifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/*.txt
            release/*.zip
            release/*.pdex
